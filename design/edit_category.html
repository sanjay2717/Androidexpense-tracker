<script>
  (function initCategorySheet() {
    const input = document.getElementById('category-name-input');
    const previewName = document.getElementById('preview-name');
    const previewBadge = document.getElementById('preview-badge');
    const previewIcon = document.getElementById('preview-icon');
    const iconIndicator = document.getElementById('icon-indicator');
    const clearBtn = document.getElementById('clear-name-btn');
    const saveBtn = document.getElementById('save-category-btn');

    // Sync input to hero name
    if (input && previewName) {
      input.addEventListener('input', (e) => {
        previewName.textContent = e.target.value.trim() || 'Untitled Category';
      });
    }

    // Clear input handler
    if (clearBtn && input && previewName) {
      clearBtn.addEventListener('click', () => {
        input.value = '';
        input.focus();
        previewName.textContent = 'Untitled Category';
      });
    }

    // Icon selection logic
    const iconButtons = document.querySelectorAll('.icon-option');
    iconButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        iconButtons.forEach((b) => {
          b.className = 'icon-option relative w-full aspect-square rounded-xl flex items-center justify-center bg-surface-container-low text-secondary active:scale-95 transition-all';
          const badge = b.querySelector('.selection-badge');
          if (badge) badge.remove();
          const ic = b.querySelector('.material-symbols-outlined');
          if (ic) ic.style.fontVariationSettings = "'FILL' 0";
        });

        // Set active state on clicked icon
        btn.className = 'icon-option relative w-full aspect-square rounded-xl flex items-center justify-center bg-primary-fixed text-primary transition-all duration-150 active:scale-95 shadow-sm';
        const clickedIconSpan = btn.querySelector('.material-symbols-outlined');
        if (clickedIconSpan) {
          clickedIconSpan.style.fontVariationSettings = "'FILL' 1";
          const iconName = btn.getAttribute('data-icon') || 'category';
          if (previewIcon) {
            previewIcon.textContent = iconName;
            previewIcon.style.fontVariationSettings = "'FILL' 1";
          }
        }

        const badgeHtml = '<div class="selection-badge absolute -top-1 -right-1 w-4 h-4 rounded-full bg-primary text-on-primary flex items-center justify-center text-[10px] shadow-sm"><span class="material-symbols-outlined text-[10px] font-bold">check</span></div>';
        btn.insertAdjacentHTML('beforeend', badgeHtml);

        const label = btn.getAttribute('data-label') || 'Category';
        if (iconIndicator) iconIndicator.textContent = label;
      });
    });

    // Color Swatch selection logic
    const swatches = document.querySelectorAll('.color-swatch');
    swatches.forEach((swatch) => {
      swatch.addEventListener('click', () => {
        swatches.forEach((s) => {
          s.classList.remove('ring-2', 'ring-offset-2', 'ring-offset-surface-container-lowest', 'ring-primary', 'shadow-md');
          s.classList.add('shadow-sm');
          const check = s.querySelector('.material-symbols-outlined');
          if (check) check.remove();
        });

        swatch.classList.add('ring-2', 'ring-offset-2', 'ring-offset-surface-container-lowest', 'ring-primary', 'shadow-md');
        const checkIcon = document.createElement('span');
        checkIcon.className = 'material-symbols-outlined text-[16px] font-bold';
        checkIcon.textContent = 'check';
        swatch.appendChild(checkIcon);

        // Update preview hero background color to match swatch classes
        const colorToken = swatch.getAttribute('data-color') || 'primary';
        previewBadge.className = `relative w-16 h-16 rounded-full flex items-center justify-center bg-${colorToken} text-on-${colorToken} shadow-md transition-all duration-300`;
      });
    });

    // Save CTA tactile feedback
    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        saveBtn.textContent = 'Saved!';
        saveBtn.classList.add('bg-tertiary-container');
        setTimeout(() => {
          if (window.history.length > 1) {
            window.history.back();
          }
        }, 350);
      });
    }
  })();
