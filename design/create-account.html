<script>
  (function () {
    const pwdInput = document.getElementById('user-password');
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    const pwdIcon = document.getElementById('pwd-icon');

    if (toggleBtn && pwdInput && pwdIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        pwdIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
      });
    }

    const guestBtn = document.getElementById('guest-btn');
    if (guestBtn) {
      guestBtn.addEventListener('click', function () {
        guestBtn.classList.add('opacity-70');
        setTimeout(() => guestBtn.classList.remove('opacity-70'), 180);
      });
    }
  })();
