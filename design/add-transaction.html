<button class="h-12 rounded-[14px] bg-surface-container-low active:bg-surface-container-high flex items-center justify-center font-title-2 text-title-2 text-on-surface transition-transform active:scale-[0.96]" onclick="pressDigit('4')" type="button">4</button>

<button class="h-12 rounded-[14px] bg-surface-container-low active:bg-surface-container-high flex items-center justify-center font-title-2 text-title-2 text-on-surface transition-transform active:scale-[0.96]" onclick="pressDigit('8')" type="button">8</button>
<button class="h-12 rounded-[14px] bg-surface-container-low active:bg-surface-container-high flex items-center justify-center font-title-2 text-title-2 text-on-surface transition-transform active:scale-[0.96]" onclick="pressDigit('9')" type="button">9</button>
<button class="h-12 rounded-[14px] bg-surface-container-low active:bg-surface-container-high flex items-center justify-center font-title-2 text-title-2 text-on-surface transition-transform active:scale-[0.96]" onclick="pressDigit('.')" type="button">.</button>

<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check</span>
<span>Save Expense</span>
</button>

<script>
  let currentVal = "0";
  let currentType = "expense";

  function updateDisplay() {
    const el = document.getElementById("amount-val");
    if (el) {
      el.textContent = currentVal;
    }
  }

  function pressDigit(d) {
    if (d === ".") {
      if (!currentVal.includes(".")) {
        currentVal += ".";
      }
    } else {
      if (currentVal === "0") {
        currentVal = d;
      } else {
        const parts = currentVal.split(".");
        if (parts[1] && parts[1].length >= 2) return;
        if (currentVal.length < 8) {
          currentVal += d;
        }
      }
    }
    updateDisplay();
  }

  function pressBackspace() {
    if (currentVal.length <= 1) {
      currentVal = "0";
    } else {
      currentVal = currentVal.slice(0, -1);
    }
    updateDisplay();
  }

  function selectCategory(btn, iconName) {
    const pills = document.querySelectorAll('.cat-pill');
    pills.forEach(p => {
      p.className = 'cat-pill flex items-center gap-2 px-3.5 py-2 rounded-full bg-surface-container text-on-surface shrink-0 transition-transform active:scale-95';
      const icon = p.querySelector('.material-symbols-outlined');
      if (icon) icon.className = 'material-symbols-outlined text-[18px] text-secondary';
      const text = p.querySelector('span:not(.material-symbols-outlined)');
      if (text) text.className = 'font-callout text-callout font-medium';
    });

    btn.className = 'cat-pill active flex items-center gap-2 px-3.5 py-2 rounded-full bg-primary text-on-primary shadow-[0_4px_14px_rgba(183,0,79,0.28)] shrink-0 transition-transform active:scale-95';
    const activeIcon = btn.querySelector('.material-symbols-outlined');
    if (activeIcon) activeIcon.className = 'material-symbols-outlined text-[18px] text-on-primary';
    const activeText = btn.querySelector('span:not(.material-symbols-outlined)');
    if (activeText) activeText.className = 'font-callout text-callout font-semibold text-on-primary';
  }

  function switchType(type) {
    currentType = type;
    const indicator = document.getElementById("type-indicator");
    const expenseLabel = document.getElementById("expense-label");
    const expenseIcon = document.getElementById("expense-icon");
    const incomeLabel = document.getElementById("income-label");
    const incomeIcon = document.getElementById("income-icon");
    const typeSubtitle = document.getElementById("type-subtitle");

    if (type === "expense") {
      indicator.style.transform = "translateX(0%)";
      expenseLabel.className = "font-callout text-callout text-on-surface font-semibold";
      expenseIcon.className = "material-symbols-outlined text-[17px] text-primary";
      incomeLabel.className = "font-callout text-callout text-secondary";
      incomeIcon.className = "material-symbols-outlined text-[17px] text-secondary";
      typeSubtitle.textContent = "Outflow";
    } else {
      indicator.style.transform = "translateX(100%)";
      expenseLabel.className = "font-callout text-callout text-secondary";
      expenseIcon.className = "material-symbols-outlined text-[17px] text-secondary";
      incomeLabel.className = "font-callout text-callout text-on-surface font-semibold";
      incomeIcon.className = "material-symbols-outlined text-[17px] text-primary";
      typeSubtitle.textContent = "Inflow";
    }
  }

  function handleSave() {
    if (history.length > 1) {
      history.back();
    }
  }
</script></main></div></body></html>
