<!-- Shimmering glowing liquid beads effect moving across -->
<div class="absolute inset-y-0 w-12 bg-gradient-to-r from-transparent via-white/80 to-transparent animate-shimmer"></div>
</div>
<!-- Glowing bead lead dot -->
<div class="absolute top-1/2 -translate-y-1/2 left-[56%] w-2.5 h-2.5 rounded-full bg-white shadow-[0_0_8px_#FF2D78,0_0_2px_#fff] pointer-events-none transition-all duration-300" id="splash-bead"></div>
</div>
<!-- iOS Home Indicator -->
<div class="w-36 h-[5px] rounded-full bg-neutral-900/25"></div>
</div>
</div>
<script>
  (function() {
    const bar = document.getElementById('splash-progress');
    const bead = document.getElementById('splash-bead');
    if (!bar) return;

    let progress = 58;
    const interval = setInterval(() => {
      if (progress >= 94) {
        clearInterval(interval);
        return;
      }
      progress += Math.random() * 6 + 2;
      if (progress > 95) progress = 95;
      bar.style.width = progress + '%';
      if (bead) {
        bead.style.left = `calc(${progress}% - 5px)`;
      }
    }, 420);
  })();
</script></main></body></html>
